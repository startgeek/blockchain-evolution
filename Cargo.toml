[package]
name = "eth-rust-pow"
version = "0.1.0"
edition = "2021"
authors = ["madi sheriff enginestart2@gmail.com"]
description = "An educational implementation of Ethereum PoW in Rust"

[dependencies]
# For now, we're keeping dependencies minimal for the first build
